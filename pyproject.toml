[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ke"
version = "0.1.0"
description = "A framework for building Knowledge Evaluation systems (evaluating information-extraction outputs; OCR as the noisiest special case)"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "evaluation",
    "information-extraction",
    "ocr",
    "quality-estimation",
    "calibration",
    "benchmarking",
]
authors = [{ name = "Thor Whalen" }]
# Core stays lean and permissively licensed. Everything heavier or copyleft is an
# opt-in extra (see [project.optional-dependencies]); nothing copyleft/non-commercial
# is ever a default. See skills/ke-dev-licensing for the policy and landmines.
dependencies = [
    # >=0.3.45: 0.3.44 and earlier compiled `filter_regex` with `safe_compile`,
    # which re.escape's its input on Windows. That silently broke the `.json`
    # suffix filter behind `dol.Jsons` -- the store class every ke store is built
    # on -- so every write raised `KeyError: 'Key not in store: <key>.json'` on
    # Windows only. See ke CI run 28001868919 and dol PR #64.
    "dol>=0.3.45",  # local-file key-value stores (MutableMapping facades)
    "config2py",  # ~/.local/share/ke/ XDG data-folder resolution
    "jiwer",      # CER/WER (Apache-2.0; rapidfuzz C++ core)
    "rapidfuzz",  # MIT edit distance -- the permissive replacement for GPL Levenshtein
    "argh",       # CLI dispatch from function signatures
    "argcomplete",  # shell tab-completion for the CLI
]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/ke"
Repository = "https://github.com/thorwhalen/ke"
Documentation = "https://thorwhalen.github.io/ke"

[project.scripts]
ke = "ke.__main__:main"

[project.optional-dependencies]
# --- evaluation capability tiers (all permissively licensed) ---
# Richer reference-based metrics: span-F1, table (TEDS/GriTS), typed-graph edit.
metrics = ["networkx", "sacrebleu", "seqeval", "nervaluate", "apted", "zss"]
# Calibration + conformal selective prediction.
calibration = ["netcal", "scikit-learn", "mapie", "crepes"]
# Post-extraction validation & correction (schema/lexicon/anomaly).
validation = ["pydantic", "pandera", "jsonschema", "symspellpy", "pyod", "scipy"]
# Constrained / structured generation for generative extractors.
constrained = ["outlines", "xgrammar", "instructor"]
# Reference-free agreement signals (LLM/VLM self-consistency).
agreement = ["uqlm"]
# OCR fleet (the first concrete instance). Install specific engines via ocracy's
# own per-backend extras, e.g. ocracy[tesseract], ocracy[google-vision].
ocr = ["ocracy"]
# Inter-annotator agreement for the gold-standard harness.
# NOTE: `krippendorff` is GPL-3.0-or-later. It is import-only (loaded lazily
# inside `ke.harness.krippendorff_alpha`, behind `@requires_extra`), never
# vendored, and deliberately EXCLUDED from `all` -- installing it is an explicit
# act by a user who accepts GPL terms. `cohen_kappa` and `percent_agreement`
# cover the permissive IAA cases with no extra at all. See issue on replacing
# this with a permissive alpha implementation.
harness = ["krippendorff"]
# Human-in-the-loop review surface + label-free monitoring.
hitl = ["label-studio-sdk"]
monitoring = ["nannyml", "evidently"]
# Convenience aggregate of the permissive capability tiers: metrics +
# calibration + validation + ocr + agreement. Deliberately does NOT include
# `harness` (GPL krippendorff) -- `pip install ke[all]` must stay copyleft-free,
# and the license gate installs exactly this extra to enforce that.
all = [
    "networkx", "sacrebleu", "seqeval", "nervaluate", "apted", "zss",
    "netcal", "scikit-learn", "mapie", "crepes",
    "pydantic", "pandera", "jsonschema", "symspellpy", "pyod", "scipy",
    "ocracy", "uqlm",
]
# --- tooling ---
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0", "ocracy"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

# NOTE: copyleft / non-commercial libraries are NEVER a default and never enter
# `all`. They are quarantined and must be installed explicitly by the user who
# accepts their terms:
#   krippendorff (GPL-3.0-or-later, IAA alpha)-- `ke[harness]`, import-only
#   TorchCP (LGPL-3.0, graph/LLM conformal)  -- import-only, never vendor
#   surya-ocr (non-commercial RAIL-M weights) -- highest accuracy, internal research only
#   Levenshtein / python-Levenshtein (GPL)    -- replaced by rapidfuzz
#   Potato (GPL-3.0), Prodigy (proprietary)   -- HITL; HTTP-only / design reference
# The CI license gate (.github/workflows/license-gate.yml) installs `.[all]` and
# fails the build if anything copyleft or non-commercial resolves into it.

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
# `ke` is listed alongside `tests` on purpose. CI runs `pytest --doctest-modules`
# with no path argument, so collection is driven entirely by `testpaths`; with
# `["tests"]` alone every doctest in the package was collected by nobody and the
# suite still reported green. Keep the package dir here so the examples in the
# module docstrings stay executable documentation.
testpaths = ["tests", "ke"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.install]
# Unset, wads installs core dependencies only. The flagship metric's module
# doctest (ke/metrics/graphs.py) constructs a TypedGraphMetric, which needs
# `networkx` from the `metrics` extra -- without it that documented example
# cannot be verified in CI. `metrics` is permissive-only (BSD/MIT/Apache), so
# installing it here does not weaken the license gate.
extras = "metrics"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
