[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ke"
version = "0.1.1"
description = "Reserved for a future knowledge-extraction package. Evaluation work that used to live here continues at https://github.com/thorwhalen/ek"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "knowledge-extraction",
]
authors = [{ name = "Thor Whalen" }]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/ke"
Repository = "https://github.com/thorwhalen/ke"
Documentation = "https://thorwhalen.github.io/ke"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
# `ke` is listed alongside `tests` on purpose. CI runs `pytest --doctest-modules`
# with no path argument, so collection is driven entirely by `testpaths`; with
# `["tests"]` alone every doctest in the package was collected by nobody and the
# suite still reported green. Keep the package dir here so the examples in the
# module docstrings stay executable documentation.
testpaths = ["tests", "ke"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.install]
# Unset -- ke has no dependencies and no extras since issue #12's reset.
extras = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
# Disabled deliberately -- see issue #12. This repo currently holds a superseded
# draft of the knowledge-*evaluation* work, which continued as `ek`; the name
# `ke` is reserved for a future knowledge-*extraction* package. Publishing from
# here would upload the wrong code to PyPI as `ke`, replacing what is currently
# published there. Re-enable only when there is knowledge-extraction code worth
# shipping.
#
# With `enabled = false`, `publish_marker` becomes the deliberate override: a
# commit message containing "[publish]" still forces a release. Docs publishing
# is unaffected (the github-pages job depends on validation, not on publish).
enabled = false
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
